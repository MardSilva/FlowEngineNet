name: Draft release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact version from eng/release-plan.json, without the v prefix'
        required: true
        type: string
      source_ref:
        description: 'Trusted source ref: main or release/<version>'
        required: true
        default: main
        type: string
      confirmation:
        description: 'Explicit authorization to create a draft GitHub Release'
        required: true
        type: choice
        default: CANCEL
        options:
          - CANCEL
          - CREATE_DRAFT_RELEASE

permissions:
  contents: read

concurrency:
  group: draft-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  resolve:
    if: inputs.confirmation == 'CREATE_DRAFT_RELEASE'
    name: Resolve immutable candidate
    runs-on: ubuntu-latest
    outputs:
      source_revision: ${{ steps.source.outputs.revision }}
    steps:
      - name: Checkout requested source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Validate release identity and bind revision
        id: source
        shell: pwsh
        env:
          FLOW_RELEASE_VERSION: ${{ inputs.version }}
          FLOW_RELEASE_REF: ${{ inputs.source_ref }}
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File ./eng/get-release-proposal.ps1 `
            -BranchName $env:FLOW_RELEASE_REF `
            -RequestedVersion $env:FLOW_RELEASE_VERSION `
            -RequireVersionMatch | Out-Null
          $revision = (git rev-parse HEAD).Trim()
          if ($revision -notmatch '^[0-9a-f]{40}$') {
              throw 'Could not bind the candidate to a Git source revision.'
          }
          "revision=$revision" >> $env:GITHUB_OUTPUT

  validate:
    needs: resolve
    name: Validate candidate / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout requested source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.source_revision }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Validate release identity
        shell: pwsh
        env:
          FLOW_RELEASE_VERSION: ${{ inputs.version }}
          FLOW_RELEASE_REF: ${{ inputs.source_ref }}
        run: >-
          pwsh -NoProfile -ExecutionPolicy Bypass -File ./eng/get-release-proposal.ps1
          -BranchName $env:FLOW_RELEASE_REF
          -RequestedVersion $env:FLOW_RELEASE_VERSION
          -RequireVersionMatch

      - name: Restore
        run: dotnet restore Flow.sln

      - name: Verify formatting
        run: dotnet format Flow.sln --verify-no-changes --no-restore

      - name: Verify bilingual documentation
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ./eng/test-documentation.ps1

      - name: Verify editorial release introduction
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ./eng/test-release-introduction.ps1

      - name: Build
        run: dotnet build Flow.sln --no-restore

      - name: Test
        run: dotnet test Flow.sln --no-build

      - name: Smoke test packaged CLI
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ./eng/smoke-test-cli.ps1 -Configuration Release

  build:
    name: Build draft artifacts
    needs: [resolve, validate]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout requested source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.source_revision }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Flow.sln

      - name: Build and validate release artifacts
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ./eng/build-release-artifacts.ps1 -Configuration Release

      - name: Produce versioned dry-run evidence
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ./eng/invoke-release-dry-run.ps1

      - name: Store draft candidate
        uses: actions/upload-artifact@v7
        with:
          name: draft-release-candidate
          path: artifacts/release
          if-no-files-found: error
          retention-days: 7

  windows-portable:
    name: Build and smoke test Windows portable
    needs: [resolve, validate]
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout requested source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.source_revision }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build reproducible win-x64 portable package
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ./eng/build-windows-portable.ps1 -Configuration Release

      - name: Smoke test self-contained portable package
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ./eng/test-windows-portable.ps1

      - name: Store Windows portable candidate
        uses: actions/upload-artifact@v7
        with:
          name: draft-windows-portable
          path: artifacts/windows-portable
          if-no-files-found: error
          retention-days: 7

  windows-installer:
    name: Build Windows MSI from promoted payload
    needs: [resolve, windows-portable]
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout requested source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.source_revision }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Download promoted Windows payload
        uses: actions/download-artifact@v8.0.1
        with:
          name: draft-windows-portable
          path: artifacts/windows-portable

      - name: Extract reviewed portable payload
        shell: pwsh
        run: |
          $zip = @(Get-ChildItem -LiteralPath ./artifacts/windows-portable -Filter '*.zip' -File)
          if ($zip.Count -ne 1) { throw 'Expected exactly one promoted Windows portable ZIP.' }
          Expand-Archive -LiteralPath $zip[0].FullName -DestinationPath ./artifacts/windows-installer-payload

      - name: Build localized per-user MSI packages
        shell: pwsh
        run: >-
          pwsh -NoProfile -ExecutionPolicy Bypass -File ./eng/build-windows-installer.ps1
          -PayloadDirectory ./artifacts/windows-installer-payload
          -OutputDirectory ./artifacts/windows-installer

      - name: Store unvalidated Windows installer candidate
        uses: actions/upload-artifact@v7
        with:
          name: draft-windows-installer-unvalidated
          path: artifacts/windows-installer
          if-no-files-found: error
          retention-days: 1

  windows-installer-smoke:
    name: Install, upgrade and remove Windows MSI
    needs: [resolve, windows-portable, windows-installer]
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout requested source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.source_revision }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Download promoted Windows payload
        uses: actions/download-artifact@v8.0.1
        with:
          name: draft-windows-portable
          path: artifacts/windows-portable

      - name: Download Windows installer candidate
        uses: actions/download-artifact@v8.0.1
        with:
          name: draft-windows-installer-unvalidated
          path: artifacts/windows-installer

      - name: Extract reviewed portable payload
        shell: pwsh
        run: |
          $zip = @(Get-ChildItem -LiteralPath ./artifacts/windows-portable -Filter '*.zip' -File)
          if ($zip.Count -ne 1) { throw 'Expected exactly one promoted Windows portable ZIP.' }
          Expand-Archive -LiteralPath $zip[0].FullName -DestinationPath ./artifacts/windows-installer-payload

      - name: Prove silent install, execution, upgrade and owned removal
        shell: pwsh
        run: >-
          pwsh -NoProfile -ExecutionPolicy Bypass -File ./eng/test-windows-installer.ps1
          -ArtifactsDirectory ./artifacts/windows-installer
          -PayloadDirectory ./artifacts/windows-installer-payload

      - name: Store validated Windows installer candidate
        uses: actions/upload-artifact@v7
        with:
          name: draft-windows-installer
          path: artifacts/windows-installer
          if-no-files-found: error
          retention-days: 7

  windows-release-evidence:
    name: Bind Windows artifacts to canonical release
    needs: [resolve, build, windows-portable, windows-installer-smoke]
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout requested source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.source_revision }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download canonical CLI candidate
        uses: actions/download-artifact@v8.0.1
        with:
          name: draft-release-candidate
          path: artifacts/release

      - name: Download portable Windows candidate
        uses: actions/download-artifact@v8.0.1
        with:
          name: draft-windows-portable
          path: artifacts/windows-portable

      - name: Download validated Windows installer candidate
        uses: actions/download-artifact@v8.0.1
        with:
          name: draft-windows-installer
          path: artifacts/windows-installer

      - name: Validate shared version, revision, identity and payload
        shell: pwsh
        run: >-
          pwsh -NoProfile -ExecutionPolicy Bypass -File ./eng/verify-windows-release-artifacts.ps1
          -CanonicalArtifactsDirectory ./artifacts/release
          -PortableArtifactsDirectory ./artifacts/windows-portable
          -InstallerArtifactsDirectory ./artifacts/windows-installer
          -OutputDirectory ./artifacts/windows-release-validation

      - name: Stage unique Windows release assets
        shell: pwsh
        run: |
          $destination = './artifacts/windows-release-assets'
          New-Item -ItemType Directory -Path $destination -Force | Out-Null
          $paths = @(
              Get-ChildItem -LiteralPath ./artifacts/windows-portable -Filter '*.zip' -File
              Get-ChildItem -LiteralPath ./artifacts/windows-portable -Filter '*.cdx.json' -File
              Get-Item -LiteralPath ./artifacts/windows-portable/portable-manifest.json
              Get-Item -LiteralPath ./artifacts/windows-portable/portable-smoke-result.json
              Get-ChildItem -LiteralPath ./artifacts/windows-installer -Filter '*.msi' -File
              Get-ChildItem -LiteralPath ./artifacts/windows-installer -Filter '*.cdx.json' -File
              Get-Item -LiteralPath ./artifacts/windows-installer/installer-manifest.json
              Get-Item -LiteralPath ./artifacts/windows-installer/installer-smoke-result.json
              Get-ChildItem -LiteralPath ./artifacts/windows-release-validation -File
          )
          $duplicates = @($paths | Group-Object Name | Where-Object Count -gt 1)
          if ($duplicates.Count -ne 0) { throw "Duplicate release asset names: $($duplicates.Name -join ', ')" }
          $paths | Copy-Item -Destination $destination

      - name: Store validated Windows release assets
        uses: actions/upload-artifact@v7
        with:
          name: draft-windows-release-assets
          path: artifacts/windows-release-assets
          if-no-files-found: error
          retention-days: 7

  create-draft:
    name: Create draft GitHub Release
    needs: [resolve, build, windows-release-evidence]
    runs-on: ubuntu-latest
    environment: draft-release
    permissions:
      contents: write
    steps:
      - name: Checkout requested source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.source_revision }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download validated candidate
        uses: actions/download-artifact@v8.0.1
        with:
          name: draft-release-candidate
          path: artifacts/release

      - name: Download validated Windows release assets
        uses: actions/download-artifact@v8.0.1
        with:
          name: draft-windows-release-assets
          path: artifacts/windows-release

      - name: Create draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          FLOW_RELEASE_VERSION: ${{ inputs.version }}
        run: |
          $plan = Get-Content -LiteralPath ./eng/release-plan.json -Raw | ConvertFrom-Json
          if ($plan.packageVersion -ne $env:FLOW_RELEASE_VERSION -or
              $plan.tag -ne "v$env:FLOW_RELEASE_VERSION" -or
              $plan.githubRelease -ne 'draft-only') {
              throw 'The downloaded candidate no longer matches the checked-in draft release plan.'
          }
          $evidence = Get-Content -LiteralPath ./artifacts/release/release-evidence.json -Raw | ConvertFrom-Json
          $revision = (git rev-parse HEAD).Trim()
          if ($evidence.sourceRevision -ne $revision -or
              $evidence.sourceState -ne 'clean' -or
              -not $evidence.releaseReady -or
              $evidence.publicationPerformed) {
              throw 'The release evidence is not bound to this clean, validated source revision.'
          }
          gh release view $plan.tag *> $null
          if ($LASTEXITCODE -eq 0) {
              throw "Release or draft already exists for $($plan.tag)."
          }
          $notesPath = Join-Path $env:GITHUB_WORKSPACE 'artifacts/release-notes/release-introduction.md'
          & ./eng/new-release-introduction.ps1 `
            -Version $env:FLOW_RELEASE_VERSION `
            -OutputPath $notesPath | Out-Null
          $releaseIntroduction = Get-Content -LiteralPath $notesPath -Raw -Encoding UTF8
          $arguments = @(
              'release', 'create', $plan.tag,
              './artifacts/release/*',
              './artifacts/windows-release/*',
              '--draft',
              '--generate-notes',
              '--notes', $releaseIntroduction,
              '--fail-on-no-commits',
              '--latest=false',
              '--target', $revision,
              '--title', "Flow Engine .NET $($plan.packageVersion)"
          )
          if ($plan.channel -eq 'prerelease') {
              $arguments += '--prerelease'
          }
          & gh @arguments
          if ($LASTEXITCODE -ne 0) {
              throw 'GitHub did not create the draft release.'
          }
