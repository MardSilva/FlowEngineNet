name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: ${{ matrix.os }} / .NET
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Flow.sln

      - name: Verify formatting
        run: dotnet format Flow.sln --verify-no-changes --no-restore

      - name: Build
        run: dotnet build Flow.sln --no-restore

      - name: Test
        run: dotnet test Flow.sln --no-build

      - name: Smoke test packaged CLI
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ./eng/smoke-test-cli.ps1 -Configuration Release
