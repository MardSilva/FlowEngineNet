name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: ${{ matrix.os }} / .NET
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Flow.sln

      - name: Verify formatting
        run: dotnet format Flow.sln --verify-no-changes --no-restore

      - name: Build
        run: dotnet build Flow.sln --no-restore

      - name: Test
        run: dotnet test Flow.sln --no-build

      - name: Smoke test packaged CLI
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ./eng/smoke-test-cli.ps1 -Configuration Release

      - name: Build and validate local release artifacts
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ./eng/build-release-artifacts.ps1 -Configuration Release

      - name: Dry-run versioned release
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ./eng/invoke-release-dry-run.ps1

      - name: Store release comparison evidence
        uses: actions/upload-artifact@v7
        with:
          name: release-evidence-${{ runner.os }}
          path: |
            artifacts/release/release-evidence.json
            artifacts/release/release-dry-run.json
            artifacts/release/*.intoto.jsonl
          if-no-files-found: error
          retention-days: 1

  compare-release:
    name: Compare Windows/Linux release evidence
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download release evidence
        uses: actions/download-artifact@v8
        with:
          pattern: release-evidence-*
          path: artifacts/cross-platform

      - name: Compare portable artifact hashes
        shell: pwsh
        run: >-
          pwsh -NoProfile -ExecutionPolicy Bypass -File ./eng/compare-release-evidence.ps1
          -WindowsEvidenceDirectory ./artifacts/cross-platform/release-evidence-Windows
          -LinuxEvidenceDirectory ./artifacts/cross-platform/release-evidence-Linux
          -OutputPath ./artifacts/cross-platform/release-comparison.json
